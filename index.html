<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Discovery Hub — NX VERTEX</title>
<style>
@font-face{font-family:"Satoshi";font-weight:700;font-style:normal;font-display:swap;src:url(/fonts/satoshi-700.woff2) format("woff2")}
@font-face{font-family:"Montserrat";font-weight:400;font-style:normal;font-display:swap;src:url(/fonts/montserrat-400.woff2) format("woff2")}
@font-face{font-family:"Montserrat";font-weight:600;font-style:normal;font-display:swap;src:url(/fonts/montserrat-600.woff2) format("woff2")}
@font-face{font-family:"Montserrat";font-weight:700;font-style:normal;font-display:swap;src:url(/fonts/montserrat-700.woff2) format("woff2")}

:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --tracao:#0094ff; --tracao-700:#0075cc; --tracao-100:#e3f1ff;
  --potencial:#00ce7e; --potencial-700:#00925a; --potencial-100:#e0f8ee;
  --estrutura:#053756; --origem:#07111f; --visao:#eaf2f8;
  --n50:#f6f9fc; --n100:#eaf2f8; --n200:#d6e2ec; --n300:#b8c7d5; --n400:#8b9dae;
  --n500:#647688; --n600:#455565; --n700:#2c3a49; --n800:#17222f; --n900:#07111f;
  --warn:#d08a16; --danger:#c0392b;
  --grad:linear-gradient(90deg,#0094ff 0%,#00ce7e 100%);
  --grad-deep:linear-gradient(160deg,#07111f 0%,#053756 100%);

  --bg:#ffffff; --bg-soft:var(--visao); --card:#ffffff; --card-soft:var(--n50);
  --text:var(--n700); --heading:var(--origem); --muted:var(--n500); --accent:var(--tracao-700);
  --border:var(--n200); --border-strong:var(--n300);
  --side-bg:var(--origem); --side-text:#fff; --side-muted:var(--n300); --side-line:rgba(255,255,255,.16);
  --bubble-ai:var(--n50); --bubble-user:var(--origem); --bubble-user-text:#fff;
  --shadow-sm:0 2px 6px rgba(7,17,31,.07); --shadow-md:0 8px 20px -6px rgba(7,17,31,.14);
  --focus:0 0 0 3px rgba(0,148,255,.32);
  --ease:cubic-bezier(.2,.6,.2,1);
  --display:"Satoshi","Montserrat",system-ui,sans-serif;
  --core:"Montserrat",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1624; --bg-soft:#07111f; --card:#111d2c; --card-soft:#17222f;
    --text:#d6e2ec; --heading:#ffffff; --muted:#8b9dae; --accent:#4fb3ff;
    --border:#243546; --border-strong:#2f4358;
    --bubble-ai:#17222f; --bubble-user:#0094ff; --bubble-user-text:#fff;
    --tracao-100:#0f2a44; --potencial-100:#0d2e24;
    --shadow-sm:none; --shadow-md:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1624; --bg-soft:#07111f; --card:#111d2c; --card-soft:#17222f;
  --text:#d6e2ec; --heading:#ffffff; --muted:#8b9dae; --accent:#4fb3ff;
  --border:#243546; --border-strong:#2f4358;
  --bubble-ai:#17222f; --bubble-user:#0094ff; --bubble-user-text:#fff;
  --tracao-100:#0f2a44; --potencial-100:#0d2e24;
  --shadow-sm:none; --shadow-md:none;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
#root{height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--core);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;color:var(--heading);font-family:var(--display);font-weight:700;letter-spacing:-0.02em;line-height:1.2}
h1{font-size:34px}h2{font-size:26px}h3{font-size:20px}h4{font-size:17px;font-family:var(--core);letter-spacing:0}
p{margin:0 0 12px}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
button,input,textarea,select{font:inherit;color:inherit}
textarea{resize:vertical}
img{max-width:100%}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.18em;color:var(--muted)}
.rule{height:6px;width:96px;background:var(--grad);border-radius:3px;margin:16px 0 24px}
.rule.sm{height:3px;width:64px;margin:12px 0 16px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:6px;border:1px solid transparent;font-weight:600;font-size:14px;cursor:pointer;background:var(--tracao);color:#fff;transition:background 120ms var(--ease),transform 120ms var(--ease)}
.btn:hover{background:var(--tracao-700)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:none;box-shadow:var(--focus)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.secondary{background:var(--origem);color:#fff}.btn.secondary:hover{background:var(--estrutura)}
.btn.outline{background:transparent;border-color:var(--border-strong);color:var(--accent)}.btn.outline:hover{background:var(--card-soft)}
.btn.ghost{background:transparent;color:var(--accent);padding:8px 12px}.btn.ghost:hover{background:var(--card-soft)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--border)}
.btn svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.75;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* forms */
label.field{display:block;margin-bottom:18px}
label.field>span{display:block;font-size:13px;font-weight:600;color:var(--heading);margin-bottom:6px}
label.field .hint{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-top:4px}
.input,textarea.input{width:100%;padding:11px 14px;border:1px solid var(--border-strong);border-radius:6px;background:var(--card);color:var(--text);transition:box-shadow 120ms var(--ease),border-color 120ms var(--ease)}
.input:focus{outline:none;border-color:var(--tracao);box-shadow:var(--focus)}
textarea.input.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.55}
.row{display:flex;gap:16px;flex-wrap:wrap}
.row>*{flex:1 1 240px}

/* cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-sm);padding:24px}
.card.accent{position:relative;overflow:hidden}
.card.accent::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--grad)}
.card.soft{background:var(--card-soft);border:none;box-shadow:none}
.callout{border:1px solid var(--border);border-left:3px solid var(--tracao);border-radius:6px;padding:12px 16px;background:var(--card-soft);font-size:14px}
.callout.warn{border-left-color:var(--warn)}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;background:var(--n100);color:var(--n600)}
.badge.pos{background:var(--potencial-100);color:var(--potencial-700)}
.badge.solid{background:var(--tracao);color:#fff}
.badge.warn{background:#fbf1de;color:#8a5a0c}
.badge.danger{background:#f8e1de;color:var(--danger)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .badge{background:#243546;color:#d6e2ec}}

/* progress */
.progress{height:8px;background:var(--n200);border-radius:999px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--grad);border-radius:999px;transition:width 220ms var(--ease)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .progress{background:#243546}}

/* layout: admin */
.app{display:flex;height:100%;min-height:100%}
.app .side{order:0}.app .main{order:1}
.main{flex:1 1 auto;min-width:0;overflow:auto;padding:40px 48px 64px}
.main .wrap{max-width:1040px}
.side{flex:0 0 272px;background:var(--side-bg);color:var(--side-text);display:flex;flex-direction:column;border-right:1px solid var(--side-line);overflow:hidden auto;transition:flex-basis 220ms var(--ease);position:relative}
.side.collapsed{flex-basis:68px}
.side .toggle{position:absolute;top:22px;right:12px;width:32px;height:32px;border-radius:6px;border:1px solid var(--side-line);background:transparent;color:var(--side-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background 120ms var(--ease)}
.side .toggle:hover{background:rgba(255,255,255,.08);color:#fff}
.side .toggle svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.75;fill:none;stroke-linecap:round;stroke-linejoin:round}
.side.collapsed .brand{padding:0;min-height:76px}
.side.collapsed .brand img{display:none}
.side.collapsed .brand .app-name,.side.collapsed .brand .app-sub{display:none}
.side.collapsed .toggle{right:18px}
.side.collapsed nav .group{height:14px;padding:0;overflow:hidden;color:transparent;border-top:1px solid var(--side-line);margin:8px 12px 0}
.side.collapsed nav button{justify-content:center;padding:12px 0}
.side.collapsed nav button .lbl,.side.collapsed nav button .count{display:none}
.side.collapsed .foot{display:none}
.side .brand{padding:28px 64px 20px 24px;border-bottom:1px solid var(--side-line)}
.side .brand img{height:26px;display:block}
.side .brand .app-name{margin-top:14px;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-0.01em;color:#fff}
.side .brand .app-sub{font-size:12px;color:var(--side-muted);margin-top:2px}
.side nav{padding:16px 12px;display:flex;flex-direction:column;gap:4px}
.side nav .group{padding:14px 12px 6px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.18em;color:var(--side-muted)}
.side nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:none;color:var(--side-text);padding:10px 12px;border-radius:6px;cursor:pointer;font-size:14px;font-weight:600;transition:background 120ms var(--ease)}
.side nav button:hover{background:rgba(255,255,255,.08)}
.side nav button.active{background:rgba(255,255,255,.12)}
.side nav button .count{margin-left:auto;font-size:12px;font-weight:600;color:var(--side-muted)}
.side nav button svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.75;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none;color:var(--potencial)}
.side .foot{margin-top:auto;padding:20px 24px;border-top:1px solid var(--side-line);font-size:12px;color:var(--side-muted)}
.side .foot b{color:#fff;font-weight:600}
@media (max-width:860px){
  .app{flex-direction:column}
  .side,.side.collapsed{flex:0 0 auto;border-right:none;border-bottom:1px solid var(--side-line);position:sticky;top:0;z-index:5;max-height:40vh}
  .side .toggle{display:none}
  .side.collapsed nav button{justify-content:flex-start;padding:10px 12px}
  .side.collapsed nav button .lbl{display:inline}
  .side .brand{display:none}
  .side nav{flex-direction:row;flex-wrap:wrap;padding:8px}
  .side nav .group{display:none}
  .side nav button{width:auto}
  .side .foot{display:none}
  .main{padding:24px 20px 48px}
}

.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:28px}
.page-head p{max-width:640px;margin:8px 0 0;color:var(--muted)}

/* list */
.list{display:grid;gap:12px}
.item{display:grid;grid-template-columns:1fr auto;gap:8px 24px;align-items:center;padding:18px 22px;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-sm);cursor:pointer;transition:border-color 120ms var(--ease)}
.item:hover{border-color:var(--border-strong)}
.item h4{font-size:16px}
.item .meta{font-size:13px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap}
.item .actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.empty{padding:48px 24px;text-align:center;color:var(--muted);border:1px dashed var(--border-strong);border-radius:10px}
.empty h3{font-family:var(--core);font-size:17px;color:var(--heading);letter-spacing:0;margin-bottom:6px}

/* docs */
.docs{display:grid;gap:8px;margin-top:8px}
.doc{display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--border);border-radius:6px;background:var(--card-soft);font-size:13px}
.doc .name{font-weight:600;color:var(--heading);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc .size{color:var(--muted)}
.doc button{background:none;border:none;color:var(--muted);cursor:pointer;padding:4px}
.doc button:hover{color:var(--danger)}
.dropzone{display:flex;flex-direction:column;align-items:center;gap:8px;border:1.5px dashed var(--border-strong);border-radius:10px;padding:28px 20px;text-align:center;color:var(--muted);font-size:13px;cursor:pointer;background:var(--card-soft);transition:border-color 120ms var(--ease),background 120ms var(--ease)}
.dropzone:hover,.dropzone.over,.dropzone:focus-within{border-color:var(--tracao);background:var(--tracao-100)}
.dropzone .ico{color:var(--accent);display:flex}
.dropzone .t{font-weight:600;color:var(--heading);font-size:14px}
.dropzone input{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}

.linkbox{display:flex;gap:8px;align-items:center;margin-top:12px}
.linkbox code{flex:1;min-width:0;padding:10px 14px;border:1px solid var(--border);border-radius:6px;background:var(--card-soft);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* tables */
table.data{width:100%;border-collapse:collapse;font-size:14px}
table.data th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding:8px 12px;border-bottom:2px solid var(--border-strong)}
table.data td{padding:12px;border-bottom:1px solid var(--border);vertical-align:top}
table.data td.num,table.data th.num{text-align:right;font-variant-numeric:tabular-nums}
table.data tr.click{cursor:pointer}table.data tr.click:hover td{background:var(--card-soft)}

/* respond page */
.respond{height:100%;display:flex;flex-direction:column;background:var(--bg-soft)}
.respond .top{background:var(--origem);color:#fff;padding:28px 0 22px;border-bottom:1px solid rgba(255,255,255,.16)}
.respond .top .wrap,.respond .body .wrap{max-width:860px;margin:0 auto;padding:0 24px}
.respond .top img{height:22px;display:block;margin-bottom:22px}
.respond .top h1{color:#fff;font-size:28px}
.respond .top p{color:var(--n300);margin:8px 0 0;max-width:640px}
.respond .top .stats{display:flex;gap:24px;align-items:center;margin-top:18px;font-size:13px;color:var(--n300);flex-wrap:wrap}
.respond .top .stats b{color:#fff;font-weight:600}
.respond .top .progress{flex:1 1 200px;min-width:160px;background:rgba(255,255,255,.14)}
.respond .body{flex:1 1 auto;overflow:auto;padding:28px 0 40px}

.chat{display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:12px;max-width:88%}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg .avatar{flex:none;width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--border)}
.msg .avatar img{width:20px;height:auto}
.msg.user .avatar{background:var(--origem);border-color:var(--origem);color:#fff;font-size:12px;font-weight:600;font-family:var(--display)}
.msg .bubble{padding:14px 18px;border-radius:10px;background:var(--bubble-ai);border:1px solid var(--border);box-shadow:var(--shadow-sm);font-size:15px;line-height:1.55}
.msg.user .bubble{background:var(--bubble-user);color:var(--bubble-user-text);border-color:transparent;white-space:pre-wrap}
.msg .bubble p:last-child{margin-bottom:0}
.msg .bubble ul,.msg .bubble ol{margin:6px 0 10px;padding-left:20px}
.msg .bubble li{margin:2px 0}
.msg .bubble .qlabel{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.18em;color:var(--muted);margin-bottom:6px;display:flex;gap:10px;align-items:center}
.msg .bubble .qtext{font-weight:600;color:var(--heading);font-size:16px}
.msg .bubble.eval{border-left:3px solid var(--tracao)}
.msg .bubble.eval.good{border-left-color:var(--potencial)}
.msg .bubble.eval.bad{border-left-color:var(--warn)}
.score{display:inline-flex;align-items:baseline;gap:4px;font-family:var(--display);font-weight:700;font-size:20px;color:var(--accent);letter-spacing:-0.02em}
.score small{font-family:var(--core);font-weight:600;font-size:11px;color:var(--muted)}
.thinking{display:inline-flex;gap:5px;align-items:center;color:var(--muted);font-size:13px}
.thinking i{width:6px;height:6px;border-radius:50%;background:var(--tracao);opacity:.35;animation:pulse 900ms var(--ease) infinite}
.thinking i:nth-child(2){animation-delay:150ms}.thinking i:nth-child(3){animation-delay:300ms}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.thinking i{animation:none;opacity:.8}}

.composer{position:sticky;bottom:0;background:var(--bg-soft);padding:16px 0 8px;margin-top:16px}
.composer .box{display:flex;gap:10px;align-items:flex-end;background:var(--card);border:1px solid var(--border-strong);border-radius:10px;padding:10px 10px 10px 16px;box-shadow:var(--shadow-md)}
.composer textarea{flex:1;border:none;background:transparent;outline:none;padding:6px 0;min-height:24px;max-height:220px;resize:none;line-height:1.5}
.composer .btn{padding:10px 14px}
.composer .box .attach{flex:none;width:38px;height:38px;border-radius:8px;border:1px solid var(--border-strong);background:transparent;color:var(--accent);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background 120ms var(--ease),border-color 120ms var(--ease)}
.composer .box .attach:hover{background:var(--card-soft);border-color:var(--tracao)}
.composer .box .attach:focus-visible{outline:none;box-shadow:var(--focus)}
.composer .box .attach svg{width:20px;height:20px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round}
.composer input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:8px;max-width:280px;padding:6px 10px;border:1px solid var(--border);border-radius:999px;background:var(--card);font-size:12px;box-shadow:var(--shadow-sm)}
.chip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--heading);font-weight:600}
.chip .sz{color:var(--muted)}
.chip button{background:none;border:none;color:var(--muted);cursor:pointer;padding:0;display:flex}
.chip button:hover{color:var(--danger)}
.chip img{width:24px;height:24px;border-radius:4px;object-fit:cover}
.chip.busy{opacity:.6}
.msg .files{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.msg .files span{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;font-size:11px;background:rgba(255,255,255,.16)}
.msg .bubble.eval .files span,.msg:not(.user) .files span{background:var(--n100);color:var(--n600)}
.composer .foot{font-size:12px;color:var(--muted);margin-top:8px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* dashboard */
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media (max-width:760px){.grid4{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px 20px;box-shadow:var(--shadow-sm)}
.stat .lbl{font-size:12px;color:var(--muted);font-weight:600}
.stat .val{font-family:var(--display);font-weight:700;font-size:34px;color:var(--accent);letter-spacing:-0.02em;line-height:1.1;margin-top:6px}
.stat .val.pos{color:var(--potencial-700)}
.stat .val.warn{color:var(--warn)}
.stat .val.dark{color:var(--heading)}
.stat .sub{font-size:12px;color:var(--muted);margin-top:4px}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--core);fill:var(--muted);font-size:11px}
.chart .val{fill:var(--heading);font-weight:600;font-size:12px}
.qa{border-top:1px solid var(--border);padding:18px 0}
.qa:first-child{border-top:none}
.qa .q{font-weight:600;color:var(--heading);display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.qa .a{margin:8px 0;white-space:pre-wrap;font-size:14px}
.qa .f{font-size:13px;color:var(--muted);border-left:3px solid var(--border-strong);padding-left:12px;margin-top:8px}
.finishing{max-width:560px;margin:8px auto 0;padding:24px 28px}
.finishing .progress{margin:14px 0 18px}
.finishing ol{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.finishing li{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted)}
.finishing li .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--border-strong);display:flex;align-items:center;justify-content:center;flex:none;font-size:12px;color:#fff}
.finishing li.doing{color:var(--heading);font-weight:600}
.finishing li.doing .dot{border-color:var(--tracao);border-top-color:transparent;animation:spin 800ms linear infinite}
.finishing li.done{color:var(--heading)}
.finishing li.done .dot{background:var(--potencial);border-color:var(--potencial)}
.finishing li.fail .dot{background:var(--warn);border-color:var(--warn)}
.finishing li .note{margin-left:auto;font-size:12px;color:var(--muted);font-weight:400}
.acc{display:grid;gap:10px}
.acc-item{background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-sm);overflow:hidden}
.acc-row{display:grid;grid-template-columns:28px minmax(220px,1.6fr) 90px 90px 150px auto;gap:12px 16px;align-items:center;padding:16px 18px;cursor:pointer;transition:background 120ms var(--ease)}
.acc-row:hover{background:var(--card-soft)}
.acc-row .chev{display:flex;color:var(--muted);transition:transform 160ms var(--ease)}
.acc-row.open .chev{transform:rotate(90deg);color:var(--accent)}
.acc-row.no-sessions .acc-title{color:var(--muted)}
.acc-table table.data td:last-child,.acc-table table.data td:nth-child(4){white-space:nowrap}
.acc-title{font-weight:600;color:var(--heading);font-size:15px}
.acc-row .meta{font-size:12px;color:var(--muted);display:flex;gap:10px;align-items:center;margin-top:4px}
.acc-col{display:flex;flex-direction:column;line-height:1.2}
.acc-col b{font-family:var(--display);font-size:18px;color:var(--heading);font-weight:700}
.acc-col small{font-size:11px;color:var(--muted)}
.acc-col.num b{font-variant-numeric:tabular-nums}
.acc-actions{justify-self:end}
.acc-body{border-top:1px solid var(--border);background:var(--card-soft)}
.acc-table{overflow-x:auto;padding:4px 8px 8px}
.acc-table table.data td,.acc-table table.data th{padding:10px 12px}
@media (max-width:900px){.acc-row{grid-template-columns:24px 1fr auto}.acc-col,.acc-actions{display:none}}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:24px 0 20px}
.tabs button{background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;padding:10px 16px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;transition:color 120ms var(--ease)}
.tabs button:hover{color:var(--heading)}
.tabs button.active{color:var(--accent);border-bottom-color:var(--tracao)}
.tabs button:focus-visible{outline:none;box-shadow:var(--focus);border-radius:6px}
.actions-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--origem);color:#fff;padding:10px 18px;border-radius:6px;font-size:13px;font-weight:600;opacity:0;transition:opacity 220ms var(--ease);pointer-events:none;z-index:50}
.toast.on{opacity:1}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--border-strong);border-top-color:var(--tracao);border-radius:50%;animation:spin 700ms linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
.center{display:flex;align-items:center;justify-content:center;height:100%;padding:24px}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast" class="toast"></div>
<script>
/* Discovery Hub — ponte entre a UI do artifact e as APIs da Vercel
   (Vercel Blob, Gemini, AgentMail, sessão de admin). */
(function () {
  "use strict";

  const jsonFetch = async (url, opts) => {
    const r = await fetch(url, Object.assign({ cache: "no-store" }, opts));
    let body = null;
    try { body = await r.json(); } catch (e) {}
    if (!r.ok) {
      const err = new Error((body && (body.detail || body.error)) || ("HTTP " + r.status));
      err.code = (body && body.error) || ("http_" + r.status);
      throw err;
    }
    return body;
  };

  const api = (op, payload) =>
    jsonFetch("/api/db", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(Object.assign({ op }, payload || {})),
    });

  const wrapDocs = (docs) =>
    (docs || []).map((d) => ({ id: d.id, data: () => d.data || {} }));

  const db = {
    collection(name) {
      const q = { field: null, value: null };
      const self = {
        where(field, op, value) {
          if (op !== "==") throw new Error("apenas o operador == é suportado");
          q.field = field; q.value = value;
          return self;
        },
        async get() {
          const r = await api("list", { col: name, whereField: q.field, whereValue: q.value });
          return { docs: wrapDocs(r.docs) };
        },
        onSnapshot(cb, errCb) {
          let stopped = false;
          let timer = null;
          let last = "";
          const tick = async () => {
            if (stopped) return;
            try {
              const r = await api("list", { col: name, whereField: q.field, whereValue: q.value });
              const sig = JSON.stringify(r.docs);
              if (sig !== last) { last = sig; cb({ docs: wrapDocs(r.docs) }); }
            } catch (e) {
              if (errCb) try { errCb(e); } catch (x) {}
            }
            if (!stopped) timer = setTimeout(tick, document.hidden ? 30000 : 8000);
          };
          tick();
          return () => { stopped = true; if (timer) clearTimeout(timer); };
        },
      };
      return self;
    },
    doc(path) {
      return {
        async get() {
          const r = await api("get", { path });
          return { exists: !!r.exists, data: () => r.data || {} };
        },
        async set(data) { return api("set", { path, data }); },
        async delete() { return api("delete", { path }); },
      };
    },
  };

  const user = {
    async canEdit() {
      try { const r = await jsonFetch("/api/auth"); return !!r.canEdit; } catch (e) { return false; }
    },
  };

  const sample = {
    async json(prompt, opts) {
      const r = await jsonFetch("/api/ai", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt, images: (opts && opts.images) || [] }),
      });
      return r.data;
    },
  };

  const assets = {
    async upload(file) {
      const r = await jsonFetch("/api/upload?name=" + encodeURIComponent(file.name || "arquivo"), {
        method: "POST",
        headers: { "Content-Type": file.type || "application/octet-stream" },
        body: file,
      });
      return { id: r.id, url: r.url };
    },
  };

  const downloads = {
    async save(opts) {
      const blob = new Blob([opts.data], { type: "text/markdown;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = opts.filename || "arquivo.md";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      return { ok: true };
    },
  };

  const CAPS = { db, user, sample, assets, downloads };
  window.claude = window.claude || {};
  window.claude.use = (name) =>
    CAPS[name] ? Promise.resolve(CAPS[name]) : Promise.reject(Object.assign(new Error("capability desconhecida"), { code: "not_granted" }));

  window.dhAttach = async (sessionId, file) => {
    const r = await jsonFetch(
      "/api/attach?session=" + encodeURIComponent(sessionId) + "&name=" + encodeURIComponent(file.name || "arquivo"),
      { method: "POST", headers: { "Content-Type": file.type || "application/octet-stream" }, body: file }
    );
    return { url: r.url, bytes: r.bytes };
  };

  window.dhBundleUrl = (sessionId, title) =>
    "/api/bundle?session=" + encodeURIComponent(sessionId) + "&title=" + encodeURIComponent(title || "respostas");

  window.dhPublish = (payload) =>
    jsonFetch("/api/publish", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });

  window.dhSendMail = (payload) =>
    jsonFetch("/api/mail", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });

  window.dhSendChat = (payload) =>
    jsonFetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });

  /* ---------- barra de acesso administrativo ---------- */
  const isAdminRoute = () => !/^#\/(r|s)\//.test(location.hash || "#/");

  async function paintAuthBar() {
    let bar = document.getElementById("dh-auth");
    if (!isAdminRoute()) { if (bar) bar.remove(); return; }
    let state = { canEdit: false, configured: true };
    try { state = await jsonFetch("/api/auth"); } catch (e) {}
    if (!bar) {
      bar = document.createElement("div");
      bar.id = "dh-auth";
      bar.style.cssText =
        "position:fixed;right:16px;bottom:16px;z-index:9999;display:flex;gap:8px;align-items:center;" +
        "font:500 13px/1.2 Montserrat,system-ui,sans-serif";
      document.body.appendChild(bar);
    }
    bar.innerHTML = "";
    const btn = document.createElement("button");
    btn.style.cssText =
      "border:0;border-radius:999px;padding:10px 18px;cursor:pointer;color:#fff;" +
      "box-shadow:0 6px 20px rgba(7,17,31,.25);background:" + (state.canEdit ? "#07111f" : "#0094ff");
    btn.textContent = state.canEdit ? "Sair do modo admin" : "Acesso administrativo";
    btn.onclick = async () => {
      btn.disabled = true;
      try {
        if (state.canEdit) {
          await jsonFetch("/api/auth", { method: "DELETE" });
        } else {
          const pwd = window.prompt("Senha de administrador");
          if (!pwd) { btn.disabled = false; return; }
          await jsonFetch("/api/auth", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password: pwd }),
          });
        }
        location.reload();
      } catch (e) {
        btn.disabled = false;
        window.alert(e.code === "invalid_password" ? "Senha incorreta" : "Falha na autenticação: " + e.message);
      }
    };
    bar.appendChild(btn);
  }

  window.addEventListener("hashchange", paintAuthBar);
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", paintAuthBar);
  else paintAuthBar();
})();
</script>

function inlineMd(s){
  s=esc(s);
  s=s.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*(?!\*)(.+?)\*(?!\*)/g,"$1<i>$2</i>").replace(/`([^`]+)`/g,"<code>$1</code>");

}
function mdToHtml(md){
  const lines=String(md||"").split(/\r?\n/); let out=[],list=null;
  const flush=()=>{ if(list){ out.push(`</${list}>`); list=null; } };
  for(const raw of lines){
    const l=raw.trim();
    if(!l){ flush(); continue; }
    let m;
    if((m=l.match(/^(#{1,4})\s+(.*)/))){ flush(); out.push(`<p><b>${inlineMd(m[2])}</b></p>`); continue; }
    if((m=l.match(/^[-*+]\s+(.*)/))){ if(list!=="ul"){flush();list="ul";out.push("<ul>");} out.push(`<li>${inlineMd(m[1])}</li>`); continue; }
    if((m=l.match(/^\d+[.)]\s+(.*)/))){ if(list!=="ol"){flush();list="ol";out.push("<ol>");} out.push(`<li>${inlineMd(m[1])}</li>`); continue; }
    flush(); out.push(`<p>${inlineMd(l)}</p>`);
  }
  flush(); return out.join("");
}
// Perguntas: headings viram seção; itens de lista viram perguntas; sem lista, cada parágrafo é uma pergunta.
function parseQuestions(md){
  const lines=String(md||"").split(/\r?\n/);
  const hasList=lines.some(l=>/^\s*([-*+]|\d+[.)])\s+/.test(l));
  const qs=[]; let section=""; let cur=null;
  for(const raw of lines){
    const l=raw.replace(/\s+$/,"");
    if(!l.trim()){ cur=null; continue; }
    let m;
    if((m=l.match(/^\s*#{1,4}\s+(.*)/))){ section=m[1].trim(); cur=null; continue; }
    if((m=l.match(/^\s*([-*+]|\d+[.)])\s+(.*)/))){ cur={id:"q"+(qs.length+1),section,text:m[2].trim(),note:""}; qs.push(cur); continue; }
    if(hasList){ if(cur){ cur.note=(cur.note?cur.note+" ":"")+l.trim(); } continue; }
    if(/^\s+/.test(l) && cur){ cur.text+=" "+l.trim(); continue; }
    cur={id:"q"+(qs.length+1),section,text:l.trim(),note:""}; qs.push(cur);
  }
  return qs;
}

    const mm=await loadMammoth(); const r=await mm.extractRawText({arrayBuffer:await file.arrayBuffer()}); att.text=String(r.value||"").trim();
  } else if(kind==="xlsx"){
    const X=await loadXlsx(); const wb=X.read(await file.arrayBuffer(),{type:"array"}); const out=[];
    for(const name of wb.SheetNames){ out.push("## "+name+"\n"+X.utils.sheet_to_csv(wb.Sheets[name])); if(out.join("").length>MAX_FILE_CHARS) break; }
    att.text=out.join("\n\n").trim();
  } else {
    att.text=(await file.text()).trim();
  }
  att.text=att.text.slice(0,MAX_FILE_CHARS);
  if(!att.text) throw new Error("não consegui extrair texto deste arquivo");
  return att;
}
let pdfjsP=null;
function loadPdfJs(){
  if(pdfjsP) return pdfjsP;
  pdfjsP=new Promise((res,rej)=>{
    const s=document.createElement("script"); s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    s.onload=()=>{ try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; res(window.pdfjsLib);}catch(e){rej(e);} };
    s.onerror=()=>rej(new Error("pdf.js não carregou")); document.head.append(s);
  });
  return pdfjsP;
}
async function extractText(file){
  const name=file.name.toLowerCase();
  if(name.endsWith(".pdf")||file.type==="application/pdf"){
    const pdfjs=await loadPdfJs(); const buf=await file.arrayBuffer();
    const pdf=await pdfjs.getDocument({data:buf}).promise; let out=[];
    for(let i=1;i<=pdf.numPages;i++){ const pg=await pdf.getPage(i); const tc=await pg.getTextContent(); out.push(tc.items.map(it=>it.str).join(" ")); }
    return out.join("\n\n").replace(/[ \t]+/g," ").trim();
  }
  return (await file.text()).trim();
}

async function handleFiles(files){

    const line=h("div",{class:"small",style:"text-align:right;margin-top:8px;color:"+(st.length?"var(--danger)":"var(--muted)")},
      st.length?"Falha no envio automático: "+st.join(" · ")+". ":"Enviado para "+EMAIL_TO+" e para o Google Chat.");
    if(st.length&&!opts.readonly) line.append(h("a",{href:"#",onclick:async ev=>{ ev.preventDefault(); ev.target.textContent="Reenviando…"; await publishAndNotify(set,sess); if(R.sess===sess) await saveSess(); w.innerHTML=""; renderDashboard(w,set,sess,opts); }},"Tentar de novo"));
    w.append(line);
  }
  const tabs=h("div",{class:"tabs",role:"tablist"});
  const panes={dash:h("div",{role:"tabpanel"}),detail:h("div",{role:"tabpanel",class:"hidden"})};
  const tbDash=h("button",{class:"active",role:"tab",onclick:()=>sel("dash")},"Dashboard");
  const tbDet=h("button",{role:"tab",onclick:()=>sel("detail")},"Detalhe das respostas");
  const sel=k=>{ tbDash.classList.toggle("active",k==="dash"); tbDet.classList.toggle("active",k==="detail"); panes.dash.classList.toggle("hidden",k!=="dash"); panes.detail.classList.toggle("hidden",k!=="detail"); };
  tabs.append(tbDash,tbDet); w.append(tabs,panes.dash,panes.detail);
  // dashboard
  panes.dash.append(h("div",{class:"grid4"},
    stat("Perguntas",qs.length,"dark"),
    stat("Respondidas",answered,answered>=qs.length?"pos":"dark"),
    stat("Refinadas",refined,"dark",refined?"pediram complemento":"nenhum complemento"),
    stat("Anexos",nFiles,"dark")));
  if(sess.final&&(sess.final.resumo||sess.final.lacunas?.length)){
    const c=h("div",{class:"card accent",style:"margin-top:16px"});
    c.append(h("div",{class:"eyebrow"},"Análise geral"),h("div",{class:"rule sm"}),h("p",null,sess.final.resumo));
    const cols=h("div",{class:"row"});
    if(sess.final.pontos_fortes?.length) cols.append(h("div",null,h("h4",{style:"margin-bottom:8px"},"Pontos fortes"),h("ul",{style:"margin:0;padding-left:18px"},...sess.final.pontos_fortes.map(p=>h("li",null,p)))));
    if(sess.final.lacunas?.length) cols.append(h("div",null,h("h4",{style:"margin-bottom:8px"},"Lacunas"),h("ul",{style:"margin:0;padding-left:18px"},...sess.final.lacunas.map(p=>h("li",null,p)))));
    c.append(cols);
    if(sess.final.proximo_passo) c.append(h("div",{class:"callout",style:"margin-top:16px"},h("b",null,"Próximo passo: "),sess.final.proximo_passo));
    panes.dash.append(c);
  }
  // detalhe
  const list=h("div",{class:"card"});
  list.append(h("div",{class:"eyebrow"},"Respostas"),h("h4",{style:"margin:6px 0 8px"},"Detalhe por pergunta"));
  answers.forEach((a,i)=>{
    list.append(h("div",{class:"qa"},h("div",{class:"q"},h("span",null,(i+1)+". "+a.question),a.followupQ?h("span",{class:"badge warn",style:"flex:none"},"Refinada"):null),
      h("div",{class:"a"},a.answer||"—"),
      a.followupQ?h("div",{class:"a",style:"margin-top:4px"},h("span",{class:"small muted"},"Complemento pedido: "+a.followupQ),"\n",a.followupA||"—"):null,
      (a.files||[]).concat(a.followupFiles||[]).length?h("div",{class:"small muted",style:"margin-top:6px"},"Anexos: "+(a.files||[]).concat(a.followupFiles||[]).map(f=>f.name).join(", ")+(a.filesSummary?" — "+a.filesSummary:"")):null,
      a.feedback?h("div",{class:"f"},a.feedback):null));
  });
  if(!answers.length) list.append(h("div",{class:"muted small"},"Nenhuma resposta registrada."));
  panes.detail.append(list);
}

boot();
})();
</script>
</body>
</html>
